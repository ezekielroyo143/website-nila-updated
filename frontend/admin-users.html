<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Users - Admin Dashboard</title>
    <link rel="stylesheet" href="./css/admin.css" />
    <link rel="stylesheet" href="./css/admin-users.css" />
  </head>
  <body>
    <div class="admin-layout">
      <aside class="sidebar">
        <div class="sidebar-header">
          <div class="logo-icon">H</div>
          <div>
            <h2>Hotel Admin</h2>
            <span>Management Panel</span>
          </div>
        </div>

        <nav class="sidebar-nav">
          <a href="admin.html" class="nav-item">
            <span class="nav-icon">⌂</span>
            <span>Dashboard</span>
          </a>
          <a href="admin-rooms.html" class="nav-item">
            <span class="nav-icon">▣</span>
            <span>Rooms</span>
          </a>
          <a href="admin-reservation.html" class="nav-item">
            <span class="nav-icon">▤</span>
            <span>Reservations</span>
          </a>
          <a href="admin-users.html" class="nav-item active">
            <span class="nav-icon">♙</span>
            <span>Users</span>
          </a>
          <a href="admin-settings.html" class="nav-item">
            <span class="nav-icon">⚙</span>
            <span>Settings</span>
          </a>
        </nav>

        <div class="sidebar-bottom">
          <div class="admin-profile">
            <div class="profile-avatar">A</div>
            <div class="profile-info">
              <strong>Administrator</strong>
              <span>Hotel Manager</span>
            </div>
          </div>
          <button id="logoutBtn" class="logout-btn">
            <span>↪</span> Logout
          </button>
        </div>
      </aside>

      <main class="main-content">
        <header class="topbar">
          <div class="page-title">
            <h1>Users</h1>
            <p>Manage registered users</p>
          </div>
          <div class="topbar-actions">
            <button class="notification-btn" id="notificationBtn">
              ♢
              <span class="notification-dot"></span>
            </button>
            <div class="topbar-profile">
              <div class="profile-avatar">A</div>
              <div>
                <strong>Administrator</strong>
                <span>Admin</span>
              </div>
            </div>
          </div>
        </header>

        <div class="dashboard-content">
          <section class="content-section">
            <div class="section-header">
              <div>
                <h2>Registered Users</h2>
                <p id="userCount">Loading users...</p>
              </div>
              <div class="search-box">
                <input
                  type="text"
                  id="searchInput"
                  placeholder="Search users..."
                />
              </div>
            </div>

            <div class="table-container">
              <table>
                <thead>
                  <tr>
                    <th>Name</th>
                    <th>Email</th>
                    <th>Phone</th>
                    <th>Registered</th>
                    <th>Action</th>
                  </tr>
                </thead>
                <tbody id="usersTableBody">
                  <tr>
                    <td colspan="5" class="loading-cell">Loading users...</td>
                  </tr>
                </tbody>
              </table>
            </div>
          </section>
        </div>
      </main>
    </div>

    <button class="mobile-menu-btn" id="mobileMenuBtn">☰</button>
    <div class="mobile-overlay" id="mobileOverlay"></div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script type="module" src="./js/config.js"></script>
    <script type="module" src="./js/admin-users.js"></script>
  </body>
</html>
