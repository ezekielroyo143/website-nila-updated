<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Register - Mac Van Mae</title>
    <link rel="stylesheet" href="./css/style.css" />
  </head>
  <body>
    <header class="site-header">
      <div class="container nav">
        <a class="brand" href="./index.html">Mac Van Mae <span>Resort</span></a
        ><a href="./index.html" class="btn">Home</a>
      </div>
    </header>
    <main class="form-page">
      <div class="form-card">
        <p class="eyebrow">JOIN US</p>
        <h1>Create Account</h1>
        <p>Register to reserve your room online.</p>
        <form id="registerForm">
          <div class="form-row">
            <div class="form-group">
              <label>First Name</label><input id="firstName" required />
            </div>
            <div class="form-group">
              <label>Last Name</label><input id="lastName" required />
            </div>
          </div>
          <div class="form-group">
            <label>Phone</label><input id="phone" type="tel" required />
          </div>
          <div class="form-group">
            <label>Email</label><input id="email" type="email" required />
          </div>
          <div class="form-group">
            <label>Password</label
            ><input id="password" type="password" minlength="6" required />
          </div>
          <div class="form-group">
            <label>Confirm Password</label
            ><input
              id="confirmPassword"
              type="password"
              minlength="6"
              required
            />
          </div>
          <button class="btn btn-primary" type="submit">Create Account</button>
          <div id="message"></div>
        </form>
        <p style="margin-top: 18px">
          Already registered? <a class="text-link" href="./login.html">Login</a>
        </p>
      </div>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="./js/supabase.js"></script>
    <script src="./js/register.js"></script>
    <script src="./js/auth.js"></script>
  </body>
</html>
